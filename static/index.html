<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task Tracker</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
body{font-family:sans-serif;max-width:600px;margin:2em auto;padding:0 1em}
h1{font-size:1.5em}
ul{list-style:none;padding:0}
li{margin:.5em 0;padding:.5em;border:1px solid #ccc;border-radius:4px;display:flex;align-items:center;gap:.5em}
li .info{flex-grow:1}
li .status{font-size:.8em;color:#666}
form{display:flex;flex-direction:column;gap:.5em;margin-bottom:1em}
form input{padding:.4em;font-size:1em}
form button{padding:.4em 1em;cursor:pointer}
.error{color:red;margin:.5em 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect} = React;

function App() {
  const [tasks, setTasks] = useState([]);
  const [title, setTitle] = useState('');
  const [dueDate, setDueDate] = useState('');
  const [error, setError] = useState('');

  const fetchTasks = () => {
    fetch('/tasks')
      .then(r => r.json())
      .then(setTasks)
      .catch(() => {});
  };

  useEffect(() => { fetchTasks(); }, []);

  const handleSubmit = (e) => {
    e.preventDefault();
    setError('');
    const params = new URLSearchParams();
    params.append('title', title);
    if (dueDate) params.append('dueDate', dueDate);
    fetch('/tasks', { method: 'POST', body: params })
      .then(r => {
        if (r.ok) {
          setTitle('');
          setDueDate('');
          return r.json().then(() => fetchTasks());
        } else {
          return r.json().then(data => { setError(data.detail); });
        }
      })
      .catch(() => setError('Network error'));
  };

  const handleComplete = (id) => {
    fetch('/tasks/' + id + '/complete', { method: 'PATCH' })
      .then(r => { if (r.ok) fetchTasks(); });
  };

  const handleDelete = (id) => {
    fetch('/tasks/' + id, { method: 'DELETE' })
      .then(r => { if (r.ok) fetchTasks(); });
  };

  return (
    <div>
      <h1>Task Tracker</h1>
      <form onSubmit={handleSubmit}>
        <input
          placeholder="Task title"
          value={title}
          onChange={e => setTitle(e.target.value)}
          required
        />
        <input
          type="date"
          placeholder="Due date (optional)"
          value={dueDate}
          onChange={e => setDueDate(e.target.value)}
        />
        <button type="submit">Add Task</button>
      </form>
      {error && <div className="error">{error}</div>}
      <ul>
        {tasks.map(task => (
          <li key={task.id}>
            <div className="info">
              <strong>{task.title}</strong>
              <div className="status">
                {task.dueDate && <span>Due: {task.dueDate} | </span>}
                Status: {task.status}
              </div>
            </div>
            {task.status === 'open' && (
              <button onClick={() => handleComplete(task.id)}>Done</button>
            )}
            <button onClick={() => handleDelete(task.id)}>Delete</button>
          </li>
        ))}
      </ul>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
