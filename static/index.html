<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task Tracker</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
  label { display: block; margin-top: 0.5rem; }
  input { width: 100%; box-sizing: border-box; }
  .error { color: red; margin-top: 0.5rem; }
  .task { border: 1px solid #ccc; padding: 0.5rem; margin: 0.5rem 0; }
  .task h3 { margin: 0; }
  .task p { margin: 0.2rem 0; }
  button { margin-right: 0.3rem; }
</style>
</head>
<body>
<div id="root">
  <h1>Task Tracker</h1>
  <form id="add-form">
    <label>Title: <input type="text" id="title" required maxlength="120"></label>
    <label>Due date (optional, YYYY-MM-DD): <input type="text" id="due-date" placeholder="YYYY-MM-DD"></label>
    <button type="submit">Add Task</button>
    <div id="form-error" class="error"></div>
  </form>
  <div id="task-list"></div>
</div>
<script>
  const API = '';

  async function loadTasks() {
    const resp = await fetch(API + '/tasks');
    const tasks = await resp.json();
    const list = document.getElementById('task-list');
    list.innerHTML = '';
    if (tasks.length === 0) {
      list.innerHTML = '<p>No tasks yet.</p>';
      return;
    }
    tasks.forEach(t => {
      const div = document.createElement('div');
      div.className = 'task';
      div.dataset.id = t.id;
      div.innerHTML = `
        <h3>${escapeHtml(t.title)}</h3>
        <p>Due: ${t.due_date ? escapeHtml(t.due_date) : '—'}</p>
        <p>Status: ${escapeHtml(t.status)}</p>
        <div>
          ${t.status === 'open' ? `<button class="done-btn" data-id="${t.id}">Done</button>` : ''}
          <button class="delete-btn" data-id="${t.id}">Delete</button>
        </div>
      `;
      list.appendChild(div);
    });
    document.querySelectorAll('.done-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        await fetch(API + '/tasks/' + id + '/done', { method: 'POST' });
        loadTasks();
      });
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.dataset.id;
        await fetch(API + '/tasks/' + id, { method: 'DELETE' });
        loadTasks();
      });
    });
  }

  document.getElementById('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('title').value;
    const dueDate = document.getElementById('due-date').value || null;
    const errorDiv = document.getElementById('form-error');
    errorDiv.textContent = '';
    const body = { title };
    if (dueDate) body.due_date = dueDate;
    const resp = await fetch(API + '/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (resp.ok) {
      document.getElementById('title').value = '';
      document.getElementById('due-date').value = '';
      loadTasks();
    } else {
      const err = await resp.json();
      let msg = '';
      if (Array.isArray(err.detail)) {
        msg = err.detail.map(d => d.msg).join('; ');
      } else if (typeof err.detail === 'string') {
        msg = err.detail;
      } else {
        msg = 'An error occurred.';
      }
      errorDiv.textContent = msg;
    }
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadTasks();
</script>
</body>
</html>
