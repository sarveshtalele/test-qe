<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    h1 { color: #1a1a1a; }
    .error { color: #b91c1c; background: #fee2e2; padding: 0.5rem; border-radius: 4px; margin-bottom: 1rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    form input { flex: 1 1 12rem; padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; }
    form button { padding: 0.4rem 1rem; background: #1d4ed8; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid #eee; }
    li .info { flex: 1; }
    li .title { font-weight: 600; }
    li .meta { font-size: 0.85rem; color: #555; }
    li button { padding: 0.25rem 0.6rem; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; background: #fff; }
    li button.done { background: #16a34a; color: #fff; border-color: #16a34a; }
    li button.delete { background: #dc2626; color: #fff; border-color: #dc2626; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    (function() {
      const API_BASE = '';

      function createElement(tag, attrs, ...children) {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs || {})) {
          if (k === 'className') { el.className = v; }
          else if (k.startsWith('on')) { el.addEventListener(k.slice(2).toLowerCase(), v); }
          else { el.setAttribute(k, v); }
        }
        for (const child of children) {
          if (typeof child === 'string') { el.appendChild(document.createTextNode(child)); }
          else if (child) { el.appendChild(child); }
        }
        return el;
      }

      async function api(path, options = {}) {
        const res = await fetch(API_BASE + path, {
          headers: { 'Content-Type': 'application/json', ...options.headers },
          ...options
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.detail || 'Request failed');
        }
        return res.status === 204 ? null : res.json();
      }

      let state = {
        tasks: [],
        formTitle: '',
        formDueDate: '',
        error: null
      };

      function render() {
        const root = document.getElementById('root');
        root.innerHTML = '';
        root.appendChild(createElement('h1', {}, 'Task Tracker'));

        const errorEl = state.error ? createElement('div', { className: 'error' }, state.error) : null;
        if (errorEl) root.appendChild(errorEl);

        const form = createElement('form', { onsubmit: handleSubmit },
          createElement('input', {
            type: 'text',
            placeholder: 'Task title',
            required: true,
            value: state.formTitle,
            oninput: (e) => { state.formTitle = e.target.value; render(); }
          }),
          createElement('input', {
            type: 'date',
            value: state.formDueDate,
            oninput: (e) => { state.formDueDate = e.target.value; render(); }
          }),
          createElement('button', { type: 'submit' }, 'Add Task')
        );
        root.appendChild(form);

        const ul = createElement('ul');
        state.tasks.forEach(task => {
          const doneBtn = task.status === 'open'
            ? createElement('button', { className: 'done', onclick: () => markDone(task.id) }, 'Done')
            : null;
          const delBtn = createElement('button', { className: 'delete', onclick: () => deleteTask(task.id) }, 'Delete');
          const li = createElement('li', {},
            createElement('div', { className: 'info' },
              createElement('div', { className: 'title' }, task.title),
              createElement('div', { className: 'meta' },
                (task.due_date ? 'Due: ' + task.due_date : 'No due date') + ' | Status: ' + task.status
              )
            ),
            doneBtn,
            delBtn
          );
          ul.appendChild(li);
        });
        root.appendChild(ul);
      }

      async function loadTasks() {
        try {
          state.tasks = await api('/tasks');
          state.error = null;
        } catch (e) {
          state.error = 'Failed to load tasks';
        }
        render();
      }

      async function handleSubmit(e) {
        e.preventDefault();
        const title = state.formTitle.trim();
        if (!title) return;
        state.error = null;
        try {
          const body = { title };
          if (state.formDueDate) body.due_date = state.formDueDate;
          await api('/tasks', { method: 'POST', body: JSON.stringify(body) });
          state.formTitle = '';
          state.formDueDate = '';
        } catch (e) {
          state.error = e.message;
        }
        await loadTasks();
      }

      async function markDone(id) {
        try {
          await api('/tasks/' + id + '/done', { method: 'PUT' });
          state.error = null;
        } catch (e) {
          state.error = e.message;
        }
        await loadTasks();
      }

      async function deleteTask(id) {
        try {
          await api('/tasks/' + id, { method: 'DELETE' });
          state.error = null;
        } catch (e) {
          state.error = e.message;
        }
        await loadTasks();
      }

      loadTasks();
    })();
  </script>
</body>
</html>
