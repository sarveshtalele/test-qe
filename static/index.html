<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>200 - Task Tracker</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid #ccc; }
  .task-info { flex: 1; }
  .task-status { font-size: 0.8rem; color: #666; }
  .error { color: red; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
</style>
</head>
<body>
<div id="root">
  <h1>Tasks</h1>
  <form data-testid="add-task-form">
    <input data-testid="title-input" name="title" placeholder="Task title" required>
    <input data-testid="due-date-input" name="due_date" placeholder="YYYY-MM-DD">
    <button data-testid="add-task-button" type="submit">Add</button>
  </form>
  <div data-testid="api-error-message" class="error"></div>
  <ul data-testid="task-list"></ul>
</div>
<script>
  (function() {
    const root = document.getElementById('root');
    const form = root.querySelector('[data-testid="add-task-form"]');
    const titleInput = root.querySelector('[data-testid="title-input"]');
    const dueDateInput = root.querySelector('[data-testid="due-date-input"]');
    const errorDiv = root.querySelector('[data-testid="api-error-message"]');
    const taskList = root.querySelector('[data-testid="task-list"]');

    function renderTasks(tasks) {
      taskList.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.setAttribute('data-testid', 'task-item');
        const infoSpan = document.createElement('span');
        infoSpan.className = 'task-info';
        let info = task.title;
        if (task.due_date) {
          info += ' (due: ' + task.due_date + ')';
        }
        info += ' <span class="task-status">[' + task.status + ']</span>';
        infoSpan.innerHTML = info;
        li.appendChild(infoSpan);
        if (task.status === 'open') {
          const doneBtn = document.createElement('button');
          doneBtn.setAttribute('data-testid', 'done-button');
          doneBtn.textContent = 'Done';
          doneBtn.addEventListener('click', function() {
            fetch('/tasks/' + task.id + '/done', { method: 'PATCH' })
              .then(r => r.ok ? fetchTasks() : r.json().then(e => showError(e.detail || 'Error')));
          });
          li.appendChild(doneBtn);
        }
        const deleteBtn = document.createElement('button');
        deleteBtn.setAttribute('data-testid', 'delete-button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', function() {
          fetch('/tasks/' + task.id, { method: 'DELETE' })
            .then(r => { if (r.ok) fetchTasks(); else r.json().then(e => showError(e.detail || 'Error')); });
        });
        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      });
    }

    function fetchTasks() {
      fetch('/tasks')
        .then(r => r.json())
        .then(data => renderTasks(data.tasks))
        .catch(e => showError('Failed to load tasks'));
    }

    function showError(msg) {
      errorDiv.textContent = msg;
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      errorDiv.textContent = '';
      const title = titleInput.value;
      const due_date = dueDateInput.value || undefined;
      fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, due_date })
      })
        .then(r => {
          if (r.status === 201) {
            titleInput.value = '';
            dueDateInput.value = '';
            fetchTasks();
          } else {
            r.json().then(e => showError(e.detail || 'Error'));
          }
        })
        .catch(e => showError('Network error'));
    });

    fetchTasks();
  })();
</script>
</body>
</html>
