<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>App</title></head>
<body>
<div id="root">
  <h1>App</h1>
  <div data-testid="api-error-message" role="error" id="error-message" style="color:red; display:none;"></div>
  <div>
    <ul data-testid="task-list" role="list" id="task-list"></ul>
  </div>
  <form data-testid="add-task-form" role="form" id="task-form">
    <input data-testid="task-title-input" type="text" id="title" placeholder="Task title" required/>
    <input data-testid="task-due-date-input" type="text" id="due_date" placeholder="YYYY-MM-DD (optional)"/>
    <button data-testid="add-task-submit" type="submit">Add Task</button>
  </form>
  <div style="display:none">
    <div data-testid="task-item" role="item"></div>
    <div data-testid="done-button" role="button"></div>
    <div data-testid="delete-button" role="button"></div>
    <div data-testid="task-title-text" role="text"></div>
    <div data-testid="task-due-date-text" role="text"></div>
    <div data-testid="task-status-text" role="text"></div>
  </div>
</div>
<script src="/main.js"></script>
</body></html>
