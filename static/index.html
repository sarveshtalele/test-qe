<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task Tracker</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
  th { background: #f5f5f5; }
  .error { color: red; margin-top: 0.5rem; }
  form { margin-top: 1rem; }
  form input, form button { margin-right: 0.5rem; }
</style>
</head>
<body>
<h1>Tasks</h1>
<div id="error-placeholder"></div>
<table id="task-table">
  <thead>
    <tr><th>Title</th><th>Due date</th><th>Status</th><th>Actions</th></tr>
  </thead>
  <tbody id="task-list"></tbody>
</table>
<form id="add-task-form">
  <input type="text" id="title-input" placeholder="Title" required>
  <input type="date" id="due-date-input" placeholder="Due date (YYYY-MM-DD)">
  <button type="submit">Add Task</button>
</form>
<div id="form-error" class="error"></div>
<script>
  const API_BASE = '';

  async function loadTasks() {
    const res = await fetch(API_BASE + '/tasks');
    const tasks = await res.json();
    const tbody = document.getElementById('task-list');
    tbody.innerHTML = '';
    tasks.forEach(task => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(task.title)}</td>
        <td>${task.due_date ? escapeHtml(task.due_date) : ''}</td>
        <td>${escapeHtml(task.status)}</td>
        <td>
          ${task.status === 'open' ? `<button class="done-btn" data-id="${task.id}">Done</button>` : ''}
          <button class="delete-btn" data-id="${task.id}">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
    attachActionHandlers();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function attachActionHandlers() {
    document.querySelectorAll('.done-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        await fetch(API_BASE + '/tasks/' + id + '/complete', { method: 'PATCH' });
        loadTasks();
      });
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        await fetch(API_BASE + '/tasks/' + id, { method: 'DELETE' });
        loadTasks();
      });
    });
  }

  document.getElementById('add-task-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const titleInput = document.getElementById('title-input');
    const dueDateInput = document.getElementById('due-date-input');
    const formError = document.getElementById('form-error');
    formError.textContent = '';

    const payload = { title: titleInput.value };
    if (dueDateInput.value) {
      payload.due_date = dueDateInput.value;
    }

    const res = await fetch(API_BASE + '/tasks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      titleInput.value = '';
      dueDateInput.value = '';
      loadTasks();
    } else {
      const err = await res.json();
      const msg = err.detail && err.detail[0] ? err.detail[0].msg : (err.detail || 'Error');
      formError.textContent = msg;
    }
  });

  loadTasks();
</script>
</body>
</html>
