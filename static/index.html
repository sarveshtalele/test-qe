<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Tracker</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [tasks, setTasks] = useState([]);
      const [title, setTitle] = useState('');
      const [dueDate, setDueDate] = useState('');
      const [error, setError] = useState('');

      const fetchTasks = async () => {
        try {
          const res = await fetch('/tasks');
          if (!res.ok) throw new Error('Failed to load tasks');
          const data = await res.json();
          setTasks(data);
        } catch (e) {
          setError(e.message);
        }
      };

      useEffect(() => { fetchTasks(); }, []);

      const handleAdd = async (e) => {
        e.preventDefault();
        setError('');
        const body = { title };
        if (dueDate) body.due_date = dueDate;
        try {
          const res = await fetch('/tasks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          if (!res.ok) {
            const errData = await res.json();
            const msg = errData.detail ? (typeof errData.detail === 'string' ? errData.detail : errData.detail[0]?.msg || 'Unknown error') : 'Unknown error';
            setError(msg);
            return;
          }
          setTitle('');
          setDueDate('');
          fetchTasks();
        } catch (e) {
          setError(e.message);
        }
      };

      const handleComplete = async (id) => {
        try {
          const res = await fetch(`/tasks/${id}/complete`, { method: 'PUT' });
          if (!res.ok) {
            const errData = await res.json();
            alert(errData.detail || 'Failed to complete task');
            return;
          }
          fetchTasks();
        } catch (e) {
          alert(e.message);
        }
      };

      const handleDelete = async (id) => {
        try {
          const res = await fetch(`/tasks/${id}`, { method: 'DELETE' });
          if (!res.ok) {
            const errData = await res.json();
            alert(errData.detail || 'Failed to delete task');
            return;
          }
          fetchTasks();
        } catch (e) {
          alert(e.message);
        }
      };

      return (
        <div style={{ maxWidth: '600px', margin: 'auto', fontFamily: 'sans-serif' }}>
          <h1>Task Tracker</h1>
          <form onSubmit={handleAdd} style={{ marginBottom: '1em' }}>
            <input
              type="text"
              placeholder="Task title"
              value={title}
              onChange={e => setTitle(e.target.value)}
              required
              style={{ marginRight: '0.5em' }}
            />
            <input
              type="date"
              value={dueDate}
              onChange={e => setDueDate(e.target.value)}
              style={{ marginRight: '0.5em' }}
            />
            <button type="submit">Add Task</button>
            {error && <p style={{ color: 'red' }}>{error}</p>}
          </form>
          <ul style={{ listStyle: 'none', padding: 0 }}>
            {tasks.map(task => (
              <li key={task.id} style={{ border: '1px solid #ccc', margin: '0.5em 0', padding: '0.5em' }}>
                <strong>{task.title}</strong>
                <span> | Due: {task.due_date || 'N/A'}</span>
                <span> | Status: {task.status}</span>
                {task.status === 'open' && (
                  <button onClick={() => handleComplete(task.id)} style={{ marginLeft: '0.5em' }}>Done</button>
                )}
                <button onClick={() => handleDelete(task.id)} style={{ marginLeft: '0.5em' }}>Delete</button>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
